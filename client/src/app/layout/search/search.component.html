<div
    class="flex w-full items-center rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 transition focus-within:border-gray-400 focus-within:bg-white">

    <mat-icon class="shrink-0 text-gray-400">
        search
    </mat-icon>

    <input 
        class="ml-2 min-w-0 w-full bg-transparent text-sm text-gray-700 outline-none placeholder:text-gray-400"
        type="search" 
        name="search" 
        [(ngModel)]="searchText"
        (input)="onSearch()"
        placeholder="Search products..."/>

</div>
