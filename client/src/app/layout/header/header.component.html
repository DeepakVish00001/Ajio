<header class="w-full border-b border-gray-200 bg-white shadow-sm">

    <div class="mx-auto max-w-screen-2xl px-3 sm:px-4">

        <!-- TOP HEADER -->

        <div class="flex items-center justify-between gap-3">

            <!-- LOGO -->
            <a class="shrink-0 cursor-pointer">

                <img routerLink="/"  src="/images/logo.png" alt="App Logo" class="h-11 w-auto object-contain sm:h-14">

            </a>


            <!-- DESKTOP NAVIGATION -->
            <nav class="hidden shrink-0 items-center gap-5 uppercase lg:flex xl:gap-7">

                <a 
                    routerLink="/" 
                    routerLinkActive="active" 
                    [routerLinkActiveOptions]="{exact:true}"
                    class="cursor-pointer text-sm font-medium text-gray-700 transition hover:text-black">
                    Home
                </a>

                <a routerLink="/shop" routerLinkActive="active" class="cursor-pointer text-sm font-medium text-gray-700 transition hover:text-black">
                    Shop
                </a>

                <a class="cursor-pointer text-sm font-medium text-gray-700 transition hover:text-black">
                    Contact
                </a>

            </nav>


            <!-- DESKTOP SEARCH -->
            <div class="mx-2 hidden max-w-lg flex-1 items-center lg:flex xl:mx-6">
                <app-search 
                    class="block w-full"
                    ></app-search>
            </div>


            <!-- RIGHT ACTIONS -->
            <div class="flex shrink-0 items-center gap-1 sm:gap-2">

                <!-- CART -->
                <a routerLink="/cart" routerLinkActive="active">

                    <mat-icon 
                        matBadge="{{cartServices.itemCount()}}" 
                        matBadgeSize="small">
                        shopping_cart
                    </mat-icon>

                </a>


                <!-- LOGIN -->
                <button routerLink="/account/login" mat-stroked-button>
                    Login
                </button>


                <!-- REGISTER -->
                <button routerLink="/account/register" mat-flat-button>
                    Register
                </button>


                <!-- MOBILE MENU -->
                <button type="button" mat-icon-button>

                    <mat-icon>
                        menu
                    </mat-icon>

                </button>

            </div>

        </div>


        <!-- MOBILE / TABLET SEARCH -->

        <div class="pb-3 lg:hidden">

            <div class="flex w-full items-center rounded-lg border border-gray-200 bg-gray-50 px-3 py-2">

                <mat-icon class="text-gray-400">
                    search
                </mat-icon>

                <input type="text" placeholder="Search products..."
                    class="ml-2 w-full bg-transparent text-sm text-gray-700 outline-none placeholder:text-gray-400">

            </div>

        </div>


        <!-- MOBILE NAVIGATION -->

        <nav class="flex items-center justify-center gap-6 overflow-x-auto pb-3 uppercase lg:hidden">

            <a class="shrink-0 cursor-pointer text-sm font-medium text-gray-700 hover:text-black">
                Home
            </a>

            <a class="shrink-0 cursor-pointer text-sm font-medium text-gray-700 hover:text-black">
                Shop
            </a>

            <a class="shrink-0 cursor-pointer text-sm font-medium text-gray-700 hover:text-black">
                Contact
            </a>

        </nav>

    </div>

</header>
