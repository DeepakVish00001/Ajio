<section class="container">
    @if(cartServices.cart()?.items?.length! > 0) {
    <div class="max-auto max-w-screen">
        <div class="flex w-full items-start gap-6 mt-2">
            <div class="w-3/4">
                @for (item of cartServices.cart()?.items; track item.productId) {
                <app-cart-item [item]="item"></app-cart-item>
                }
            </div>
            <div class="w-1/4">
                <app-order-summary></app-order-summary>
            </div>
        </div>
    </div>
    } @else {
    <app-empty-state></app-empty-state>
    
    }
</section>
