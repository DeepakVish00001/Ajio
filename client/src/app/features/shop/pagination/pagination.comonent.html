<div class="flex w-full items-center justify-between gap-4">

    <!-- LEFT: PRODUCT COUNT -->
    <div class="shrink-0 text-sm text-gray-500">

        <span class="font-medium text-gray-800">
            {{length}}
        </span>

        Products

        <span class="mx-2 text-gray-300">
            |
        </span>

        Page

        <span class="font-medium text-gray-800">
            {{pageIndex + 1}}
        </span>

        of

        <span class="font-medium text-gray-800">
            {{ totalPages }}
        </span>

    </div>


    <!-- RIGHT: PAGINATION -->
    <div class="flex items-center gap-1.5">

          <!-- First -->
            <button
                type="button"
                (click)="firstPage()"
                [disabled]="pageIndex === 0"
                class="h-8 shrink-0 cursor-pointer rounded-lg border border-gray-200 px-3 text-sm text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40 sm:h-9">

                First
            </button>

        <!-- Previous -->
        <button 
             type="button"
            (click)="previousPage()"
            [disabled]="pageIndex === 0"
            class="flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-100 sm:h-9 sm:w-9">

            <mat-icon>
                chevron_left
            </mat-icon>

        </button>

        @for(page of pages; track $index){

        <!-- Page 1 -->
        <button 
            type="button" 
            class="h-8 w-8 shrink-0  cursor-pointer rounded-lg bg-black text-sm font-medium text-white sm:h-9 sm:w-9"
            (click)="goToPage(page)"
            [class.bg-black]="pageIndex + 1 === page"
            [class.text-white]="pageIndex + 1 === page"
            [class.border]="pageIndex + 1 !== page"
            [class.border-gray-200]="pageIndex + 1 !== page"
            [class.text-gray-700]="pageIndex + 1 !== page"
            [class.hover:bg-gray-100]="pageIndex + 1 !== page"
            >
            {{page}}
        </button>
    }

        <!-- Page 2 -->
        <!-- <button type="button"
            class="h-8 w-8 shrink-0 rounded-lg border border-gray-200 text-sm text-gray-700 hover:bg-gray-100 sm:h-9 sm:w-9">
            2
        </button> -->


        <!-- Page 3 -->
        <!-- <button type="button"
            class="h-8 w-8 shrink-0 rounded-lg border border-gray-200 text-sm text-gray-700 hover:bg-gray-100 sm:h-9 sm:w-9">
            3
        </button> -->


        <!-- Next -->
        <button 
            (click)="nextPage()"
            [disabled]="pageIndex >= totalPages - 1"
            type="button"
            class="flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-gray-200 text-gray-500 hover:bg-gray-100 sm:h-9 sm:w-9">

            <mat-icon>
                chevron_right
            </mat-icon>

        </button>

        <!-- Last -->
  <button
    type="button"
    (click)="lastPage()"
    [disabled]="pageIndex >= totalPages - 1"
    class="h-8 shrink-0 cursor-pointer rounded-lg border border-gray-200 px-3 text-sm text-gray-700 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-40 sm:h-9">

    Last

  </button>



        <!-- <mat-paginator
            (page)="handlePageEvent($event)"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            [pageSizeOptions]="pageSizeOptions"
            [showFirstLastButtons]="true"
            [length]="length"
            aria-label="Select page"
        ></mat-paginator> -->

    </div>

</div>
